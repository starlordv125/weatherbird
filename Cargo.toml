[package]
name = "weatherbird"
version = "0.5.2"
edition = "2024"
authors = [
    "Cameron Reynolds <cameron@starlordv125.net>",
]
description = "A command line weather program made to set up once and be simple"
homepage = "https://forgejo.starlordv125.net/starlordv125/weatherbird"
include = [
    "src/*.rs",
    "README.md",
    "LICENSE",
]
license = "GPLv3"
optional = "true"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
ureq = { version = "3.3.0", features = ["json"] }

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
