name: Rust test

on:
  pull:
    branches:
      - actions

#test1
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout  # Clone git repository
          uses: actions/checkout@v3
        - name: Install Rust toolchain
          uses: https://github.com/actions/dtolnay/rust-toolchain@stable
        - name: Check that code can compile
          run: cargo check