name: RPM-test

on:
  push:
    branches:
      - packaging

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      VERSION: "0.5.2"
      MESSAGE: "This release adds the option to pick the metric system when using `weatherbird set`. Multiple bugs have been fixed, including fog showing as an unknown weather type."
      RELEASE: 13
      API_KEY: ${{ secrets.FORGEJO_TOKEN }}
      GPG_KEY: ${{ secrets.GPG_KEY }}
      GPG_PASS: ${{ secrets.GPG_PASS }}
    steps:
        - name: Checkout  # Clone git repository
          uses: actions/checkout@v3
        - name: Install Rust toolchain
          uses: https://github.com/dtolnay/rust-toolchain@stable
        - name: Setup
          run: ./scripts/setup.sh
        - name: Build binary
          run: ./scripts/build.sh
        - name: Sign all RPM packages at Packages folder.
          uses: https://github.com/signalwire/sign-rpm-packages-action@v1.0.0
          with:
            gpg_file: ./decoded-key.gpg
            gpg_name: cameron@starlordv125.net
            target_path: .
            target_folder: signed-rpm
            rpm_path: ./target/generate-rpm/weatherbird-${{ env.VERSION }}-2.x86_64.rpm
        - name: upload rpm
          run: ./scripts/rpm.sh